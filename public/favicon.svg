<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    
    <!-- Camera Lens Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Video Camera Icon with Shadow -->
  <g filter="url(#shadow)">
    <!-- Camera Body -->
    <rect x="13" y="20" width="26" height="24" rx="6" fill="url(#lensGrad)" />
    
    <!-- Camera Lens / Projector Cone -->
    <path d="M41 27.2c0-.98 1.1-.55 1.77-.11l7.46 4.97c.75.5.75 1.88 0 2.38l-7.46 4.97c-.67.44-1.77.87-1.77-.11V27.2z" fill="url(#lensGrad)" />

    <!-- Lens Detail Circle -->
    <circle cx="26" cy="32" r="5" fill="#6366f1" opacity="0.85" />
    <circle cx="26" cy="32" r="2" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Live Pulse Dot in Top-Right Corner -->
  <circle cx="50" cy="14" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
</svg>